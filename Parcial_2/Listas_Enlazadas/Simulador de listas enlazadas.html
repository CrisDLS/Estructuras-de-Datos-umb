<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Listas Enlazadas</title>
<style>
/* Colores como variables: claro por defecto, oscuro por preferencia del sistema o por el botón de tema */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#1f2430;--mut:#6b7280;--card:#f4f5f8;--ac:#2f6fed;--gr:#16a34a;--hi:#fff3c4;--hib:#d99a00;--cm:#dbe7ff;--sw:#ffe0cc;--swb:#e0702a;--bd:#cfd3de;--box:#fff;--err:#dc2626}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12141a;--fg:#e6e8ee;--mut:#9aa1b2;--card:#1a1e27;--ac:#6c9bff;--gr:#34d399;--hi:#4a3d10;--hib:#e0a800;--cm:#1e3258;--sw:#542913;--swb:#ff8a4d;--bd:#2e3545;--box:#222733;--err:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12141a;--fg:#e6e8ee;--mut:#9aa1b2;--card:#1a1e27;--ac:#6c9bff;--gr:#34d399;--hi:#4a3d10;--hib:#e0a800;--cm:#1e3258;--sw:#542913;--swb:#ff8a4d;--bd:#2e3545;--box:#222733;--err:#f87171}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tab{flex:1;min-width:120px;padding:9px 6px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;font-weight:600;cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.info{background:var(--card);border-left:4px solid var(--ac);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:10px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.ctl[hidden]{display:none}
input,select{padding:7px 10px;border:1.5px solid var(--bd);border-radius:8px;background:var(--box);color:var(--fg);font-size:13px;min-width:0}
input{flex:1 1 110px}
.b{padding:7px 12px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;font-size:13px;cursor:pointer}
.b:hover{border-color:var(--ac)}
.main{background:var(--ac);border-color:var(--ac);color:#fff}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.msg{color:var(--err);min-height:18px;font-size:13px}
.leg{font-size:12px;color:var(--mut);margin:2px 0 8px}
.view{background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.scroll{overflow-x:auto}
.stg{position:relative}
.stg svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pa,.pg,.pm{fill:none;stroke-width:2}
.pa{stroke:var(--ac)}.pg{stroke:var(--gr)}.pm{stroke:var(--mut)}
.ma{fill:var(--ac)}.mg{fill:var(--gr)}.mm{fill:var(--mut)}
.tx{font:600 11px system-ui,sans-serif;fill:var(--ac)}.tg{fill:var(--gr)}
.node{position:absolute;box-sizing:border-box;background:var(--box);border:1.5px solid var(--bd);border-radius:10px;padding:6px 8px;text-align:center;overflow:hidden}
.ad{font:10px ui-monospace,Menlo,monospace;color:var(--mut)}
.val{font-weight:700;font-size:14px}
.val small{font-weight:500;color:var(--gr);font-size:11px}
.ptrs{font:11px ui-monospace,Menlo,monospace;color:var(--mut);border-top:1px dashed var(--bd);margin-top:3px;padding-top:3px}
.ptrs span{display:block}
.node.new{background:var(--hi);border-color:var(--hib);animation:pop .3s}
.node.float{border-style:dashed}
.node.cmp{background:var(--cm);border-color:var(--ac);transform:scale(1.04)}
.node.ce{background:color-mix(in srgb,var(--gr) 20%,var(--box));border-color:var(--gr);transform:scale(1.04)}
.node.sw{background:var(--sw);border-color:var(--swb)}
.node.found{background:color-mix(in srgb,var(--gr) 30%,var(--box));border-color:var(--gr)}
@keyframes pop{from{transform:scale(.88);opacity:.5}}
@media(prefers-reduced-motion:reduce){.node.new{animation:none}}
.pl{position:absolute;font:700 11px ui-monospace,Menlo,monospace;color:var(--ac);white-space:nowrap}
.pl.g{color:var(--gr)}
.nul{position:absolute;font:700 11px ui-monospace,Menlo,monospace;color:var(--mut);padding:3px 6px;border:1px dashed var(--bd);border-radius:4px}
.empty{position:absolute;font:700 12px ui-monospace,Menlo,monospace;color:var(--mut)}
.row{position:absolute;left:0;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--gr);font-size:12px}
.chip{padding:3px 9px;border:1.5px solid var(--gr);border-radius:6px;background:var(--box);color:var(--fg);font-weight:600}
.chip.ce,.chip.found,.chip.new{background:color-mix(in srgb,var(--gr) 28%,var(--box))}
.chip.cmp{background:var(--cm);border-color:var(--ac)}
.chip.sw{background:var(--sw);border-color:var(--swb)}
.log{background:var(--box);border:1.5px solid var(--bd);border-radius:8px;padding:10px 12px;font-size:13px}
.code{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--ac);font-weight:600;margin-top:4px;overflow-x:auto}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>Simulador de Listas Enlazadas</span><button class="b" id="tbtn">🌓 Tema</button></h1>
  <p class="sub">Estructuras de Datos — UMB. Cada operación se muestra paso a paso con su código Java.</p>

  <div class="tabs">
    <button class="tab on" data-m="simple">1. Simple</button>
    <button class="tab" data-m="doble">2. Doble</button>
    <button class="tab" data-m="circular">3. Circular</button>
    <button class="tab" data-m="multi">4. Multilista</button>
  </div>
  <div class="info" id="info"></div>

  <!-- Controles para simple, doble y circular -->
  <div class="ctl" id="cN">
    <input id="v" type="number" step="1" placeholder="Valor entero (vacío = aleatorio)">
    <button class="b main" data-a="fin">Insertar al final</button>
    <button class="b" data-a="ini">Insertar al inicio</button>
    <button class="b" data-a="del">Eliminar</button>
    <button class="b" data-a="bus">Buscar</button>
    <button class="b" data-a="rec">Recorrer</button>
    <button class="b" data-a="inv" id="inv" hidden>Recorrido inverso</button>
  </div>
  <!-- Controles de la multilista -->
  <div class="ctl" id="cM" hidden>
    <input id="nm" maxlength="16" placeholder="Nombre (ej: Carlos)">
    <input id="ed" type="number" min="1" max="120" step="1" placeholder="Edad">
    <button class="b main" data-a="ins">Insertar persona</button>
    <button class="b" data-a="del">Eliminar por nombre</button>
    <button class="b" data-a="bus">Buscar por nombre</button>
    <button class="b" data-a="rec">Recorrer A-Z</button>
    <button class="b" data-a="age">Recorrer por edad</button>
  </div>
  <!-- Utilidades y control de la animación -->
  <div class="ctl">
    <button class="b" data-a="ej">Ejemplo rápido</button>
    <button class="b" data-a="vac">Vaciar</button>
    <span style="flex:1"></span>
    <button class="b" data-a="pv" aria-label="Paso anterior">◀</button>
    <button class="b" data-a="pp" id="pp">⏸ Pausar</button>
    <button class="b" data-a="nx" aria-label="Paso siguiente">▶</button>
    <button class="b" data-a="rp">↺ Repetir</button>
    <select id="spd" aria-label="Velocidad"><option value="1300">Lenta</option><option value="700" selected>Normal</option><option value="280">Rápida</option></select>
  </div>
  <div class="msg" id="msg" role="alert"></div>
  <p class="leg"><b style="color:var(--hib)">Amarillo:</b> nodo nuevo · <b style="color:var(--ac)">Azul:</b> actual / comparando · <b style="color:var(--swb)">Naranja:</b> punteros que cambian · <b style="color:var(--gr)">Verde:</b> encontrado / cadena por edad</p>

  <div class="view"><div class="scroll"><div class="stg" id="stg"></div></div></div>

  <div class="log" aria-live="polite">
    <div id="ld"></div>
    <div class="code" id="lc"></div>
    <div class="meta"><span id="st"></span><span id="cnt"></span></div>
  </div>
</div>

<script>
// ============================ ESTADO GENERAL ============================
const $ = id => document.getElementById(id);                 // atajo para buscar elementos por id
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); // evita inyectar HTML con los nombres
const MAX = 12;                                                // máximo de nodos para que el dibujo quepa
const CLS = {simple:'Nodo', doble:'NodoDoble', circular:'Nodo', multi:'NodoMulti'}; // clase Java de cada lista
const INFO = {
  simple:'Cada nodo guarda un dato y la dirección del siguiente. Insertar al inicio es O(1); insertar al final, buscar y eliminar son O(n).',
  doble:'Cada nodo guarda anterior y siguiente, y la lista conserva cabeza y cola. Insertar al final es O(1) gracias a cola, y se puede recorrer al revés.',
  circular:'El último nodo apunta de vuelta a la cabeza: no existe null. Los recorridos se detienen al volver a cabeza para no ciclar sin fin.',
  multi:'Un mismo nodo vive en dos cadenas a la vez: por nombre (A-Z, azul) y por edad (menor a mayor, verde). Cada inserción o eliminación actualiza ambas.'
};
let mode = 'simple', uid = 0, nA = 0;                          // modo activo, contador de ids, contador de direcciones
const D = {simple:[], doble:[], circular:[], multi:[]};        // datos de cada lista, en orden de enlace
const lst = () => D[mode];                                     // lista del modo activo
const addr = () => '0x' + (0x1A00 + ((++nA * 37) % 128) * 16).toString(16).toUpperCase(); // dirección simulada
const mk = (d, nom, edad) => ({u:++uid, d, nom, edad, ad:addr()}); // crea un nodo (u = identificador único)
const byAge = L => [...L].sort((a, b) => a.edad - b.edad || a.u - b.u); // orden de la cadena por edad
const msg = t => $('msg').textContent = t;                     // muestra un aviso de validación

// ============================ CUADROS DE ANIMACIÓN ============================
let steps = [], cur = 0, timer = null, paused = false;
// F guarda un cuadro: texto, código Java, nodos resaltados, nodo nuevo flotante y copia de la lista en ese instante
function F(desc, code, hi = {}, nw = null) {
  steps.push({desc, code, hi, nw, mode, L: D[mode].map(n => ({...n}))});
}
function go(i) { cur = Math.max(0, Math.min(i, steps.length - 1)); draw(steps[cur]); } // muestra el cuadro i
function play() {                                              // avanza solo, según la velocidad elegida
  clearInterval(timer);
  timer = setInterval(() => { if (!paused && cur < steps.length - 1) go(cur + 1); }, +$('spd').value);
}
function start() { paused = false; $('pp').textContent = '⏸ Pausar'; go(0); play(); }
function idle(t) { clearInterval(timer); steps = []; F(t, '// Elige una operación para ver el código Java paso a paso'); go(0); } // cuadro único sin animación

// ============================ OPERACIONES: SIMPLE, DOBLE, CIRCULAR ============================
// Recorre desde cabeza hasta el último nodo, un cuadro por nodo visitado
function walkLast(n) {
  const L = lst(), fin = mode === 'circular' ? 'cabeza' : 'null';
  F(`actual = cabeza (${L[0].ad}).`, 'Nodo actual = cabeza;', {[L[0].u]:'cmp'}, n);
  for (let i = 1; i < L.length; i++)
    F(`${L[i-1].ad}.sig no es ${fin}: actual avanza a ${L[i].ad}.`, `actual = actual.getSiguiente(); // while (actual.getSiguiente() != ${fin})`, {[L[i].u]:'cmp'}, n);
  return L[L.length - 1];
}
// Caso común: insertar en una lista vacía
function firstNode(n) {
  lst().push(n);
  const t = {simple:'cabeza = nuevo;', doble:'cabeza = nuevo; cola = nuevo;', circular:'cabeza = nuevo; nuevo.setSiguiente(nuevo); // se apunta a sí mismo'}[mode];
  F('Lista vacía: el nuevo nodo es la cabeza' + (mode === 'doble' ? ' y la cola.' : mode === 'circular' ? ' y se apunta a sí mismo.' : '.'), t, {[n.u]:'found'});
}
function insFin(v) {
  const L = lst(), n = mk(v), c = CLS[mode];
  n.at = L.length;                                             // posición donde se dibuja el nodo flotante
  F(`Se reserva un nodo nuevo con dato ${v} en ${n.ad}. Aún no está enlazado.`, `${c} nuevo = new ${c}(${v});`, {[n.u]:'new'}, n);
  if (!L.length) return firstNode(n);
  let last;
  if (mode === 'doble') { last = L[L.length-1]; F(`cola apunta al último nodo (${last.ad}): no hace falta recorrer, O(1).`, 'NodoDoble ult = cola;', {[last.u]:'cmp'}, n); }
  else last = walkLast(n);
  const t = {simple:'actual.setSiguiente(nuevo);', doble:'ult.setSiguiente(nuevo); nuevo.setAnterior(ult); cola = nuevo;', circular:'actual.setSiguiente(nuevo); nuevo.setSiguiente(cabeza);'}[mode];
  F(`Se enlaza el último nodo con el nuevo${mode === 'circular' ? ' y el nuevo vuelve a cabeza' : ''}.`, t, {[last.u]:'sw'}, n);
  L.push(n);
  F(`Nodo insertado. tamano = ${L.length}.`, 'tamano++;', {[n.u]:'new', [last.u]:'sw'});
}
function insIni(v) {
  const L = lst(), n = mk(v), c = CLS[mode];
  n.at = 0;
  F(`Se reserva un nodo nuevo con dato ${v} en ${n.ad}. Aún no está enlazado.`, `${c} nuevo = new ${c}(${v});`, {[n.u]:'new'}, n);
  if (!L.length) return firstNode(n);
  const f = L[0];
  if (mode === 'circular') {                                   // el último debe apuntar a la nueva cabeza
    const last = walkLast(n);
    F(`El último (${last.ad}) apunta al nuevo y el nuevo a la cabeza actual (${f.ad}).`, 'ult.setSiguiente(nuevo); nuevo.setSiguiente(cabeza);', {[last.u]:'sw', [f.u]:'sw'}, n);
  } else if (mode === 'doble')
    F(`nuevo.sig = cabeza (${f.ad}) y cabeza.ant = nuevo.`, 'nuevo.setSiguiente(cabeza); cabeza.setAnterior(nuevo);', {[f.u]:'sw'}, n);
  else F(`nuevo.sig apunta a la cabeza actual (${f.ad}).`, 'nuevo.setSiguiente(cabeza);', {[f.u]:'sw'}, n);
  L.unshift(n);
  F(`cabeza se mueve al nodo nuevo. tamano = ${L.length}.`, 'cabeza = nuevo; tamano++;', {[n.u]:'new'});
}
// Compara nodo por nodo; devuelve el índice encontrado o -1
function find(v) {
  const L = lst();
  for (let k = 0; k < L.length; k++) {
    F(`Comparando ${L[k].ad}: ¿${L[k].d} == ${v}?`, `${k ? 'actual = actual.getSiguiente(); ' : ''}if (actual.getDato() == ${v})`, {[L[k].u]:'cmp'});
    if (L[k].d === v) return k;
  }
  return -1;
}
function bus(v) {
  const L = lst();
  if (!L.length) return F('Lista vacía: no hay nada que buscar.', 'if (cabeza == null) return false;');
  const i = find(v);
  if (i >= 0) F(`¡${v} encontrado en ${L[i].ad}! (posición ${i})`, 'return true;', {[L[i].u]:'found'});
  else F(`${v} no está en la lista${mode === 'circular' ? ': se volvió a cabeza sin encontrarlo.' : ' (se llegó a null).'}`, 'return false;');
}
function del(v) {
  const L = lst();
  if (!L.length) return F('Lista vacía: no hay nada que eliminar.', 'if (cabeza == null) return false;');
  const i = find(v);
  if (i < 0) return F(`${v} no está en la lista.`, 'return false; // no encontrado');
  const t = L[i], p = L[i-1], nx = L[i+1], last = L[L.length-1];
  if (L.length === 1) F('Era el único nodo: la lista queda vacía.', 'cabeza = null;' + (mode === 'doble' ? ' cola = null;' : ''), {[t.u]:'sw'});
  else if (i === 0) {
    if (mode === 'circular') F(`El último (${last.ad}) debe apuntar a la nueva cabeza (${nx.ad}) para conservar el ciclo.`, 'ult.setSiguiente(cabeza.getSiguiente()); cabeza = cabeza.getSiguiente();', {[last.u]:'sw', [t.u]:'sw', [nx.u]:'cmp'});
    else if (mode === 'doble') F(`cabeza avanza a ${nx.ad} y su anterior pasa a null.`, 'cabeza = cabeza.getSiguiente(); cabeza.setAnterior(null);', {[t.u]:'sw', [nx.u]:'sw'});
    else F(`cabeza avanza al siguiente nodo (${nx.ad}).`, 'cabeza = cabeza.getSiguiente();', {[t.u]:'sw', [nx.u]:'cmp'});
  } else if (mode === 'doble') {
    F(nx ? `${p.ad}.sig salta a ${nx.ad} y ${nx.ad}.ant regresa a ${p.ad}.` : `${p.ad}.sig queda en null y cola retrocede a ${p.ad}.`,
      nx ? 'ant.setSiguiente(actual.getSiguiente()); actual.getSiguiente().setAnterior(ant);' : 'ant.setSiguiente(null); cola = ant;',
      {[p.u]:'sw', [t.u]:'sw', ...(nx ? {[nx.u]:'sw'} : {})});
  } else F(`${p.ad}.sig salta a ${nx ? nx.ad : (mode === 'circular' ? L[0].ad + ' (cabeza)' : 'null')}.`, 'ant.setSiguiente(actual.getSiguiente());', {[p.u]:'sw', [t.u]:'sw'});
  L.splice(i, 1);
  F(`Nodo ${v} desenlazado; el recolector de basura libera su memoria. tamano = ${L.length}.`, 'tamano--; return true;');
}
// Recorrido normal, inverso (solo doble) o por edad (solo multilista); acumula la salida impresa
function trav(rev, age) {
  const L = lst();
  if (!L.length) return F('Lista vacía: no hay nada que recorrer.', 'if (cabeza == null) return;');
  const seq = age ? byAge(L) : rev ? [...L].reverse() : L;
  const hd = age ? 'cabezaEdad' : rev ? 'cola' : 'cabeza', nx = age ? 'getSigEdad' : rev ? 'getAnterior' : mode === 'multi' ? 'getSigNom' : 'getSiguiente';
  let out = '';
  seq.forEach((e, k) => {
    out += (mode === 'multi' ? `${e.nom}(${e.edad})` : e.d) + ' ';
    F(`Visita ${e.ad}. Salida acumulada: ${out}`, `${k ? `actual = actual.${nx}(); ` : `${CLS[mode]} actual = ${hd}; `}System.out.print(actual.${mode === 'multi' ? 'getNombre' : 'getDato'}());`, {[e.u]: age ? 'ce' : 'cmp'});
  });
  F(mode === 'circular' ? 'actual.sig vuelve a cabeza: se completó la vuelta y el recorrido termina.' : 'actual es null: fin del recorrido.', mode === 'circular' ? '} while (actual != cabeza);' : '} // actual == null');
}

// ============================ OPERACIONES: MULTILISTA ============================
// Busca por nombre en la cadena A-Z; devuelve el índice o -1
function findM(nom) {
  const L = D.multi;
  for (let k = 0; k < L.length; k++) {
    F(`Cadena A-Z: ¿«${L[k].nom}» es «${nom}»?`, `${k ? 'actual = actual.getSigNom(); ' : ''}if (actual.getNombre().equalsIgnoreCase("${nom}"))`, {[L[k].u]:'cmp'});
    if (L[k].nom.toLowerCase() === nom.toLowerCase()) return k;
  }
  return -1;
}
function busM(nom) {
  const L = D.multi;
  if (!L.length) return F('Multilista vacía.', 'if (cabeza == null) return false;');
  const i = findM(nom);
  if (i >= 0) F(`¡«${L[i].nom}» encontrado en ${L[i].ad}! Tiene ${L[i].edad} años.`, 'return true;', {[L[i].u]:'found'});
  else F(`«${nom}» no existe en la multilista.`, 'return false;');
}
function insMulti(nom, edad) {
  const L = D.multi, n = mk(nom, nom, edad), cmp = (a, b) => a.localeCompare(b, 'es', {sensitivity:'base'});
  let pos = 0;
  while (pos < L.length && cmp(L[pos].nom, nom) <= 0) pos++;   // posición A-Z (después de nombres iguales)
  n.at = pos;
  F(`Se crea UN solo nodo para «${nom}» (${edad} años) en ${n.ad}; después se enlaza en las dos cadenas.`, `NodoMulti nuevo = new NodoMulti("${nom}", ${edad});`, {[n.u]:'new'}, n);
  for (let k = 0; k <= pos && k < L.length; k++)
    F(`Cadena A-Z: «${L[k].nom}» ${k < pos ? 'va antes de' : 'va después de'} «${nom}».`, `${k ? 'actual = actual.getSigNom(); ' : ''}// compareToIgnoreCase("${nom}") ${k < pos ? '<= 0: avanzar' : '> 0: parar aquí'}`, {[L[k].u]:'cmp'}, n);
  F(`Cadena A-Z: se enlaza ${pos ? `después de «${L[pos-1].nom}»` : 'como nueva cabeza'}.`,
    pos ? 'nuevo.setSigNom(ant.getSigNom()); ant.setSigNom(nuevo);' : 'nuevo.setSigNom(cabeza); cabeza = nuevo;',
    {[n.u]:'new', ...(pos ? {[L[pos-1].u]:'sw'} : {})}, n);
  const E = byAge(L);
  let q = 0;
  while (q < E.length && E[q].edad <= edad) q++;               // posición en la cadena por edad
  for (let k = 0; k <= q && k < E.length; k++)
    F(`Cadena de edades: ${E[k].edad} ${k < q ? '≤' : '>'} ${edad}${k < q ? ', se sigue.' : ', se inserta antes.'}`, `${k ? 'actualEdad = actualEdad.getSigEdad(); ' : 'actualEdad = cabezaEdad; '}// ${E[k].edad} ${k < q ? '<=' : '>'} ${edad}`, {[E[k].u]:'ce'}, n);
  F(`Cadena de edades: se enlaza ${q ? `después de «${E[q-1].nom}»` : 'como nueva cabezaEdad'}.`,
    q ? 'nuevo.setSigEdad(antEdad.getSigEdad()); antEdad.setSigEdad(nuevo);' : 'nuevo.setSigEdad(cabezaEdad); cabezaEdad = nuevo;',
    {[n.u]:'new', ...(q ? {[E[q-1].u]:'sw'} : {})}, n);
  L.splice(pos, 0, n);
  F(`Listo: «${nom}» está en la cadena A-Z y en la cadena por edad. tamano = ${L.length}.`, 'tamano++;', {[n.u]:'found'});
}
function delMulti(nom) {
  const L = D.multi;
  if (!L.length) return F('Multilista vacía.', 'if (cabeza == null) return false;');
  const i = findM(nom);
  if (i < 0) return F(`«${nom}» no está en la multilista.`, 'return false;');
  const t = L[i], p = L[i-1], E = byAge(L), j = E.indexOf(t);
  F(`Cadena A-Z: se desenlaza «${t.nom}».`, i ? 'ant.setSigNom(actual.getSigNom());' : 'cabeza = cabeza.getSigNom();', {[t.u]:'sw', ...(p ? {[p.u]:'sw'} : {})});
  for (let k = 0; k <= j; k++)
    F(`Cadena de edades: recorriendo hasta «${t.nom}» (${t.edad} años).`, `actualEdad = ${k ? 'actualEdad.getSigEdad()' : 'cabezaEdad'};`, {[E[k].u]:'ce'});
  F('Cadena de edades: se desenlaza también.', j ? 'antEdad.setSigEdad(actual.getSigEdad());' : 'cabezaEdad = cabezaEdad.getSigEdad();', {[t.u]:'sw', ...(j ? {[E[j-1].u]:'sw'} : {})});
  L.splice(i, 1);
  F(`«${t.nom}» salió de las dos cadenas. tamano = ${L.length}.`, 'tamano--; return true;');
}

// ============================ DIBUJO ============================
// Dibuja un cuadro: nodos en HTML y flechas en SVG
function draw(f) {
  const L = f.L, m = f.mode, mu = m === 'multi', db = m === 'doble', ci = m === 'circular', n = L.length;
  const W = mu ? 150 : db ? 132 : 112, G = 58, H = mu || db ? 80 : 62, X0 = db ? 66 : 60, Y0 = 118, yc = Y0 + H / 2;
  const xs = i => X0 + i * (W + G);                            // x de cada nodo
  const E = mu ? byAge(L) : [];                                // cadena por edad (solo multilista)
  const nx = i => L[i+1] ? L[i+1].ad : ci ? L[0].ad : 'null';  // dirección del siguiente
  const ptrs = i => db ? [`ant: ${i ? L[i-1].ad : 'null'}`, `sig: ${nx(i)}`]
    : mu ? [`sigNom: ${nx(i)}`, `sigEdad: ${(E[E.indexOf(L[i]) + 1] || {ad:'null'}).ad}`] : [`sig: ${nx(i)}`];
  const box = (e, x, y, cls, p) => `<div class="node ${cls}" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px"><div class="ad">${e.ad}</div><div class="val">${esc(e.d)}${mu ? ` <small>(${e.edad} años)</small>` : ''}</div><div class="ptrs">${p.map(t => `<span>${t}</span>`).join('')}</div></div>`;
  const P = (d, c, k) => `<path d="${d}" class="${c}" marker-end="url(#${k})"/>`;       // flecha
  const nul = (x, y) => `<div class="nul" style="left:${x}px;top:${y - 11}px">NULL</div>`;
  const lab = (i, t, lv, c) => `<span class="pl ${c}" style="left:${xs(i)}px;top:${Y0 - 18 - lv * 16}px">${t} ▾</span>`; // etiqueta sobre un nodo
  let h = '', s = '<defs>' + ['ma','mg','mm'].map(k => `<marker id="${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" class="${k}"/></marker>`).join('') + '</defs>';
  const yb = Y0 + H;
  if (!n) h += `<div class="empty" style="left:${X0}px;top:${yc - 8}px">cabeza = null${db ? ' · cola = null' : ''}</div>`;
  L.forEach((e, i) => {
    const c = f.hi[e.u] || '', x1 = xs(i) + W, x2 = xs(i + 1), ys = db ? Y0 + H * .38 : mu ? Y0 + H * .4 : yc;
    h += box(e, xs(i), Y0, c, ptrs(i));
    if (i < n - 1) {
      s += P(`M${x1} ${ys}H${x2 - 2}`, 'pa', 'ma');                        // flecha hacia el siguiente
      if (db) s += P(`M${x2} ${Y0 + H * .72}H${x1 + 2}`, 'pa', 'ma');      // flecha de regreso (anterior)
    } else if (!ci) { s += P(`M${x1} ${ys}H${x1 + 22}`, 'pm', 'mm'); h += nul(x1 + 26, ys); }
    if (c === 'cmp' || c === 'ce') h += lab(i, c === 'ce' ? 'actualEdad' : 'actual', 1, c === 'ce' ? 'g' : '');
  });
  if (n) {
    h += lab(0, db && n === 1 ? 'cabeza/cola' : mu ? 'cabeza (A-Z)' : 'cabeza', 0, '');
    if (db && n > 1) h += lab(n - 1, 'cola', 0, '');
    if (db) { s += P(`M${xs(0)} ${Y0 + H * .72}H${xs(0) - 22}`, 'pm', 'mm'); h += nul(2, Y0 + H * .72); } // anterior de la cabeza = null
  }
  if (ci && n) {                                               // arco de retorno del último a la cabeza
    const xl = xs(n - 1) + W * .6, xf = xs(0) + W * .4;
    s += P(`M${xl} ${yb}C${xl} ${yb + 52} ${xf} ${yb + 52} ${xf} ${yb + 3}`, 'pa', 'ma') + `<text x="${(xl + xf) / 2}" y="${yb + 48}" text-anchor="middle" class="tx">último.sig = cabeza (${L[0].ad})</text>`;
  }
  if (mu) {                                                    // segunda fila corta: la cadena por edad, de menor a mayor
    h += `<div class="row" style="top:${yb + 16}px"><b>Por edad:</b> cabezaEdad →` + (E.length ? E.map(e => ` <span class="chip ${f.hi[e.u] || ''}">${esc(e.nom)} (${e.edad})</span> →`).join('') : '') + ` NULL</div>`;
  }
  if (f.nw) h += box(f.nw, xs(Math.min(f.nw.at || 0, n)), 4, 'new float', db ? ['ant: ?', 'sig: ?'] : mu ? ['sigNom: ?', 'sigEdad: ?'] : ['sig: ?']); // nodo aún sin enlazar
  const st = $('stg');
  st.style.width = Math.max(380, xs(n) + 40) + 'px';
  st.style.height = (yb + (mu ? 66 : ci ? 70 : 30)) + 'px';
  st.innerHTML = `<svg>${s}</svg>${h}`;
  $('ld').textContent = f.desc;
  $('lc').textContent = f.code;
  $('cnt').textContent = `Paso ${cur + 1} / ${steps.length}`;
  $('st').textContent = `Tamaño: ${n} · cabeza: ${n ? L[0].ad : 'null'}${db ? ` · cola: ${n ? L[n-1].ad : 'null'}` : ''}`;
}

// ============================ EVENTOS ============================
// Lee los campos, valida y lanza la operación de las listas numéricas
function opNum(a) {
  const t = $('v').value.trim(), v = Number(t);
  if (t === '' && (a === 'del' || a === 'bus')) return msg('Escribe el valor en el campo.');
  if (t !== '' && !Number.isInteger(v)) return msg('Escribe un número entero.');
  if (a === 'fin' || a === 'ini') {
    if (lst().length >= MAX) return msg(`Máximo ${MAX} nodos para que el dibujo quepa. Elimina o vacía la lista.`);
    (a === 'fin' ? insFin : insIni)(t === '' ? 10 + Math.floor(Math.random() * 90) : v);
    $('v').value = '';
  } else if (a === 'del') del(v);
  else if (a === 'bus') bus(v);
  else trav(a === 'inv', false);
}
// Lo mismo para la multilista
function opMulti(a) {
  const nom = $('nm').value.trim(), t = $('ed').value.trim(), ed = t === '' ? 15 + Math.floor(Math.random() * 40) : Number(t);
  if (a === 'ins') {
    if (D.multi.length >= MAX) return msg(`Máximo ${MAX} nodos para que el dibujo quepa.`);
    if (!Number.isInteger(ed) || ed < 1 || ed > 120) return msg('La edad debe ser un entero entre 1 y 120.');
    insMulti(nom || 'Persona' + (D.multi.length + 1), ed);
    $('nm').value = $('ed').value = '';
  } else if (a === 'del' || a === 'bus') {
    if (!nom) return msg('Escribe el nombre en el campo.');
    (a === 'del' ? delMulti : busM)(nom);
  } else trav(false, a === 'age');
}
function run(a) {
  msg('');
  if (a === 'pp') { paused = !paused; $('pp').textContent = paused ? '▶ Reanudar' : '⏸ Pausar'; return; }
  if (a === 'pv' || a === 'nx') { paused = true; $('pp').textContent = '▶ Reanudar'; go(cur + (a === 'nx' ? 1 : -1)); return; }
  if (a === 'rp') { start(); return; }
  if (a === 'vac') { D[mode] = []; idle('Lista vaciada.'); return; }
  if (a === 'ej') {                                            // ejemplo animado: inserta varios nodos uno tras otro
    D[mode] = []; steps = [];                                  // parte de una lista vacía
    F('Lista vacía: se insertarán varios nodos, uno por uno, para ver cómo se arma.', '// Ejemplo: inserciones sucesivas');
    if (mode === 'multi') [['Carlos',25],['Ana',30],['Beto',18],['Diana',22]].forEach(([x, e]) => insMulti(x, e)); // desordenados a propósito
    else { const S = {simple:[30,10,40,20], doble:[35,15,45,25], circular:[16,5,12,8]}; S[mode].forEach(v => insFin(v)); }
    F(mode === 'multi' ? 'Ejemplo terminado: la cadena A-Z quedó ordenada por nombre y la fila de abajo por edad.' : 'Ejemplo terminado. Prueba insertar, buscar o eliminar.', '// Fin del ejemplo');
    start(); return;
  }
  const old = steps; steps = [];                               // si la operación no genera cuadros (error), se conserva la vista anterior
  (mode === 'multi' ? opMulti : opNum)(a);
  if (steps.length) start(); else steps = old;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) run(b.dataset.a); });
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {   // cambio de pestaña
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  mode = b.dataset.m; msg('');
  $('cN').hidden = mode === 'multi'; $('cM').hidden = mode !== 'multi'; $('inv').hidden = mode !== 'doble';
  $('info').textContent = INFO[mode];
  idle(`Lista ${b.textContent.slice(3).toLowerCase()}: ${lst().length ? 'datos conservados.' : 'vacía. Inserta un nodo o usa «Ejemplo rápido».'}`);
});
// Enter inserta. Las llaves evitan devolver `false`, que bloqueaba la escritura de las demás teclas
$('v').onkeydown = e => { if (e.key === 'Enter') run('fin'); };
$('nm').onkeydown = $('ed').onkeydown = e => { if (e.key === 'Enter') run('ins'); };
$('spd').onchange = play;
$('tbtn').onclick = () => {                                    // alterna tema claro/oscuro
  const r = document.documentElement, dark = (r.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')) === 'dark';
  r.dataset.theme = dark ? 'light' : 'dark';
};
$('info').textContent = INFO.simple;
idle('Simulador listo. Inserta un nodo o presiona «Ejemplo rápido».');
</script>
